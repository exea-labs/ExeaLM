[project]
name = "exealm"
version = "0.0.1"
description = "ExeaLM: a ~0.1B language model on the TONN architecture, built in the open by high schoolers"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy>=1.24"]

[project.optional-dependencies]
data = ["tokenizers>=0.19", "datasets>=2.18"]
dev = ["pytest>=8"]
board = ["fastapi>=0.115", "pydantic>=2.9", "uvicorn>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["exealm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
