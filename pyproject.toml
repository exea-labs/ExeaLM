[project]
name = "exealm"
version = "0.0.1"
description = "ExeaLM: a ~0.1B language model on the TONN architecture, built in the open by high schoolers"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy>=1.24"]

[project.optional-dependencies]
data = ["tokenizers>=0.19", "datasets>=2.18"]
dev = ["pytest>=8"]
faiss = ["faiss-cpu>=1.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["exealm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
